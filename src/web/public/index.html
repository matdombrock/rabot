<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Control Panel</title>
  <style>
    :root {
      --background: #141020;
      --surface: #261E36;
      --surface-alt: #382C4C;
      --primary: #B450FF;
      --text: #DCC8FF;
      --text-muted: #8C78B4;
      --text-bright: #DCC8FF;
      --danger: #88329C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--background); color: var(--text); padding: 2rem; }
    h1 { margin-bottom: 1.5rem; color: var(--primary); }
    .card { background: var(--surface); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .card-header h2 { margin-bottom: 0; cursor: pointer; color: var(--text-muted); font-size: 1rem; }
    .card-header h2:hover { opacity: 0.8; }
    .collapse-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0.25rem; line-height: 1; }
    .collapse-btn:hover { color: var(--text-bright); background: none; }
    .card-body.collapsed { display: none; }
    select, button { padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid var(--surface-alt); background: var(--surface-alt); color: var(--text); cursor: pointer; font-size: 0.9rem; }
    button:hover { background: var(--primary); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select:hover { border-color: var(--primary); }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .status { margin-top: 0.5rem; color: var(--text-muted); font-size: 0.85rem; }
    .table-wrap { margin-top: 1rem; max-height: 70vh; overflow: auto; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { position: sticky; top: 0; background: var(--surface-alt); text-align: left; padding: 0.5rem 0.75rem; white-space: nowrap; cursor: pointer; user-select: none; color: var(--text); }
    th:hover { filter: brightness(1.2); }
    th::after { content: " \25B2"; font-size: 0.6rem; opacity: 0.4; }
    th.sort-asc::after { content: " \25B2"; opacity: 1; }
    th.sort-desc::after { content: " \25BC"; opacity: 1; }
    td { padding: 0.4rem 0.75rem; border-top: 1px solid var(--surface-alt); white-space: nowrap; }
    tr:hover td { background: var(--surface-alt); }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .btn-danger { background: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: #a03db8; }
    input, textarea { width: 100%; background: var(--background); border: 1px solid var(--surface-alt); border-radius: 4px; padding: 0.5rem; color: var(--text); font-family: inherit; font-size: 0.85rem; resize: vertical; min-height: 80px; margin-top: 0.5rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
  </style>
</head>
<body>
  <h1>Bot Control Panel</h1>

  <div class="card" id="info-card">
    <div class="card-header">
      <h2>Bot Status</h2>
      <button class="collapse-btn">▴</button>
    </div>
    <div class="card-body">
      <div class="row">
        <span id="info-tag">Loading...</span>
        <button id="ping-btn">Ping</button>
      </div>
      <div id="info-details" class="status"></div>
      <div id="ping-result" class="status"></div>
    </div>
  </div>

  <div class="card" id="say-card">
    <div class="card-header">
      <h2>Say</h2>
      <button class="collapse-btn">▴</button>
    </div>
    <div class="card-body">
      <div class="row">
        <select id="say-guild"><option value="">Select guild...</option></select>
        <select id="say-channel"><option value="">Select channel...</option></select>
        <button id="say-send" disabled>Send</button>
      </div>
      <textarea id="say-text" placeholder="Type a message..."></textarea>
      <div id="say-status" class="status"></div>
    </div>
  </div>

  <div class="card" id="filter-card">
    <div class="card-header">
      <h2>Image Filter</h2>
      <button class="collapse-btn">▴</button>
    </div>
    <div class="card-body">
      <div class="row">
        <span>Action:</span>
        <select id="filter-action">
          <option value="ban">Ban</option>
          <option value="kick">Kick</option>
        </select>
        <button id="filter-save-action">Save</button>
      </div>
      <div class="row" style="margin-top: 0.5rem; align-items: stretch;">
        <div style="flex:2">
          <textarea id="filter-add-input" placeholder="SHA256 checksum..." style="min-height:36px;height:36px"></textarea>
        </div>
        <div style="flex:1">
          <textarea id="filter-add-label" placeholder="Label (optional)..." style="min-height:36px;height:36px"></textarea>
        </div>
        <button id="filter-add-btn" style="align-self: flex-end">Add</button>
      </div>
      <div id="filter-status" class="status"></div>
      <div class="table-wrap" id="filter-table"></div>
      <h3 style="margin-top:1rem;font-size:1rem;color:#a0a0a0">Log</h3>
      <div class="row">
        <button id="modlog-refresh">Refresh</button>
        <button id="modlog-clear" class="btn-sm btn-danger">Clear All</button>
      </div>
      <div id="modlog-status" class="status"></div>
      <div class="table-wrap" id="modlog-table"></div>
    </div>
  </div>

  <div class="card" id="quick-card">
    <div class="card-header">
      <h2>Quick Report</h2>
      <button class="collapse-btn">▴</button>
    </div>
    <div class="card-body">
      <div class="row">
        <select id="quick-guild"><option value="">Loading guilds...</option></select>
        <button id="quick-run" disabled>Run</button>
        <button id="quick-dl" disabled>Download CSV</button>
      </div>
      <div class="row" style="margin-top:0.5rem">
        <input id="quick-search" type="text" placeholder="Search..." style="flex:1;min-height:unset;margin-top:0">
      </div>
      <div id="quick-status" class="status"></div>
      <div class="table-wrap" id="quick-table"></div>
    </div>
  </div>

  <div class="card" id="full-card">
    <div class="card-header">
      <h2>Full Report</h2>
      <button class="collapse-btn">▴</button>
    </div>
    <div class="card-body">
      <div class="row">
        <select id="full-guild"><option value="">Loading guilds...</option></select>
        <button id="full-run" disabled>Run</button>
        <button id="full-dl" disabled>Download CSV</button>
      </div>
      <div id="full-status" class="status"></div>
      <div class="table-wrap" id="full-table"></div>
    </div>
  </div>

  <div class="card" id="history-card">
    <div class="card-header">
      <h2>Recent Reports</h2>
      <button class="collapse-btn">▴</button>
    </div>
    <div class="card-body">
      <div class="row">
        <button id="history-refresh">Refresh</button>
      </div>
      <div id="history-status" class="status"></div>
      <div class="table-wrap" id="history-table"></div>
    </div>
  </div>

  <script>
    function formatUptime(ms) {
      if (ms == null) return "N/A";
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      return `${h}h ${m % 60}m ${s % 60}s`;
    }

    function loadInfo() {
      fetch("/api/info")
        .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
        .then(data => {
          document.getElementById("info-tag").textContent = data.tag;
          document.getElementById("info-details").textContent =
            `Node ${data.node} | Uptime ${formatUptime(data.uptime)} | WS ${data.wsPing}ms`;
        })
        .catch(err => {
          document.getElementById("info-tag").textContent = "Offline";
          document.getElementById("info-details").textContent = "Error: " + err.message;
        });
    }
    loadInfo();
    setInterval(loadInfo, 10000);

    document.getElementById("ping-btn").addEventListener("click", async () => {
      const btn = document.getElementById("ping-btn");
      btn.disabled = true;
      document.getElementById("ping-result").textContent = "Pinging...";
      const start = Date.now();
      await fetch("/api/info");
      const ms = Date.now() - start;
      document.getElementById("ping-result").textContent = `Pong! ${ms}ms`;
      btn.disabled = false;
    });

    const filterAction = document.getElementById("filter-action");
    const filterSave = document.getElementById("filter-save-action");
    const filterInput = document.getElementById("filter-add-input");
    const filterLabel = document.getElementById("filter-add-label");
    const filterAdd = document.getElementById("filter-add-btn");
    const filterTable = document.getElementById("filter-table");
    const filterStatus = document.getElementById("filter-status");

    async function loadFilter() {
      const res = await fetch("/api/checksums");
      const data = await res.json();
      filterAction.value = data.action;
      if (!data.checksums.length) {
        filterTable.innerHTML = "<p style='color:#a0a0a0'>No checksums.</p>";
        return;
      }
      let html = "<table><thead><tr><th>SHA256</th><th>Label</th><th></th></tr></thead><tbody>";
      for (const e of data.checksums) {
        html += `<tr><td style="font-family:monospace;font-size:0.75rem">${e.checksum}</td><td>${e.label || ""}</td><td><button class="btn-sm btn-danger" onclick="deleteChecksum('${e.checksum}')">Delete</button></td></tr>`;
      }
      html += "</tbody></table>";
      filterTable.innerHTML = html;
    }

    window.deleteChecksum = async function(c) {
      await fetch(`/api/checksums/${c}`, { method: "DELETE" });
      loadFilter();
    };

    filterSave.addEventListener("click", async () => {
      await fetch("/api/checksums/action", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: filterAction.value }),
      });
      filterStatus.textContent = `Action saved: ${filterAction.value}`;
    });

    filterAdd.addEventListener("click", async () => {
      const c = filterInput.value.trim();
      if (!c) return;
      filterInput.value = "";
      await fetch("/api/checksums", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ checksum: c, label: filterLabel.value.trim() }),
      });
      filterLabel.value = "";
      loadFilter();
    });

    loadFilter();

    const modlogTable = document.getElementById("modlog-table");
    const modlogStatus = document.getElementById("modlog-status");

    async function loadModlog() {
      const res = await fetch("/api/modlogs");
      const logs = await res.json();
      if (!logs.length) {
        modlogTable.innerHTML = "<p style='color:#a0a0a0'>No moderation actions logged.</p>";
        modlogStatus.textContent = "";
        return;
      }
      modlogStatus.textContent = `${logs.length} entries`;
      let html = "<table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Checksum</th><th>Label</th><th>Channel</th><th>Guild</th><th>Deleted</th></tr></thead><tbody>";
      for (const e of logs) {
        html += `<tr>
          <td style="white-space:nowrap">${new Date(e.timestamp).toLocaleString()}</td>
          <td>${e.userName} (${e.userId})</td>
          <td>${e.action}</td>
          <td style="font-family:monospace;font-size:0.75rem">${e.checksum.slice(0, 16)}...</td>
          <td>${e.label || ""}</td>
          <td>${e.channelName}</td>
          <td>${e.guildName}</td>
          <td>${e.messagesDeleted}</td>
        </tr>`;
      }
      html += "</tbody></table>";
      modlogTable.innerHTML = html;
    }

    document.getElementById("modlog-refresh").addEventListener("click", loadModlog);
    document.getElementById("modlog-clear").addEventListener("click", async () => {
      if (!confirm("Clear all mod log entries?")) return;
      await fetch("/api/modlogs", { method: "DELETE" });
      loadModlog();
    });
    loadModlog();

    const sayGuild = document.getElementById("say-guild");
    const sayChannel = document.getElementById("say-channel");
    const sayText = document.getElementById("say-text");
    const saySend = document.getElementById("say-send");
    const sayStatus = document.getElementById("say-status");

    fetch("/api/guilds")
      .then(r => r.json())
      .then(guilds => {
        sayGuild.innerHTML = guilds.length
          ? `<option value="">Select guild...</option>` + guilds.map(g => `<option value="${g.id}">${g.name}</option>`).join("")
          : "<option>No guilds found</option>";
      });

    sayGuild.addEventListener("change", async () => {
      sayChannel.innerHTML = "<option>Loading channels...</option>";
      sayChannel.disabled = true;
      saySend.disabled = true;
      if (!sayGuild.value) {
        sayChannel.innerHTML = "<option>Select guild first</option>";
        return;
      }
      const res = await fetch(`/api/channels/${sayGuild.value}`);
      const channels = await res.json();
      sayChannel.innerHTML = `<option value="">Select channel...</option>` +
        channels.map(ch => `<option value="${ch.id}">${ch.name}</option>`).join("");
      sayChannel.disabled = false;
    });

    sayChannel.addEventListener("change", () => {
      saySend.disabled = !(sayGuild.value && sayChannel.value && sayText.value.trim());
    });

    sayText.addEventListener("input", () => {
      saySend.disabled = !(sayGuild.value && sayChannel.value && sayText.value.trim());
    });

    saySend.addEventListener("click", async () => {
      saySend.disabled = true;
      sayStatus.textContent = "Sending...";
      try {
        const res = await fetch("/api/send-message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ guildId: sayGuild.value, channelId: sayChannel.value, content: sayText.value }),
        });
        if (!res.ok) throw new Error((await res.json()).error);
        sayStatus.textContent = "Sent!";
        sayText.value = "";
        saySend.disabled = true;
      } catch (err) {
        sayStatus.textContent = "Error: " + err.message;
        saySend.disabled = false;
      }
    });

    function parseCsvRow(line) {
      const cells = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (line[i + 1] === '"') { current += '"'; i++; }
            else { inQuotes = false; }
          } else { current += ch; }
        } else {
          if (ch === '"') { inQuotes = true; }
          else if (ch === ',') { cells.push(current); current = ""; }
          else { current += ch; }
        }
      }
      cells.push(current);
      return cells;
    }

    function isNumeric(str) { return /^\d+(\.\d+)?$/.test(str); }

    function renderTable(csv, container) {
      const lines = csv.split("\n").filter(l => l.trim());
      if (lines.length === 0) { container.innerHTML = "<p>No data.</p>"; return; }
      const headers = parseCsvRow(lines[0]);
      const rows = lines.slice(1).map(l => parseCsvRow(l));
      let sortCol = -1;
      let sortAsc = true;

      function build(hdrs, data) {
        let html = "<table><thead><tr>";
        hdrs.forEach((h, i) => {
          const cls = i === sortCol ? (sortAsc ? "sort-asc" : "sort-desc") : "";
          html += `<th data-col="${i}" class="${cls}">${h}</th>`;
        });
        html += "</tr></thead><tbody>";
        for (const cells of data) {
          html += "<tr>";
          for (const c of cells) html += `<td>${c}</td>`;
          html += "</tr>";
        }
        html += "</tbody></table>";
        container.innerHTML = html;
        addSortListeners(container, hdrs, data);
      }

      function addSortListeners(wrap, hdrs, data) {
        wrap.querySelectorAll("th").forEach(th => {
          th.addEventListener("click", () => {
            const col = parseInt(th.dataset.col);
            if (col === sortCol) { sortAsc = !sortAsc; }
            else { sortCol = col; sortAsc = true; }
            const sorted = [...data].sort((a, b) => {
              const av = a[sortCol], bv = b[sortCol];
              if (isNumeric(av) && isNumeric(bv)) return sortAsc ? +av - +bv : +bv - +av;
              return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
            });
            build(hdrs, sorted);
          });
        });
      }

      build(headers, rows);
    }

    function createPanel(prefix, endpoint, autoRun) {
      const guildSelect = document.getElementById(`${prefix}-guild`);
      const runBtn = document.getElementById(`${prefix}-run`);
      const dlBtn = document.getElementById(`${prefix}-dl`);
      const tableWrap = document.getElementById(`${prefix}-table`);
      const status = document.getElementById(`${prefix}-status`);
      const searchInput = document.getElementById(`${prefix}-search`);
      let lastCsv = "";
      let lastGuildName = "";

      function renderFiltered() {
        if (!lastCsv) return;
        const term = searchInput ? searchInput.value : "";
        if (!term) { renderTable(lastCsv, tableWrap); return; }
        const lines = lastCsv.split("\n").filter(l => l.trim());
        if (lines.length < 2) { renderTable(lastCsv, tableWrap); return; }
        const header = lines[0];
        const rows = lines.slice(1).filter(line => {
          const cells = parseCsvRow(line);
          return cells.some(c => {
            if (!term) return true;
            const t = term.toLowerCase();
            const text = c.toLowerCase();
            let ti = 0;
            for (let i = 0; i < t.length; i++) {
              const found = text.indexOf(t[i], ti);
              if (found === -1) return false;
              ti = found + 1;
            }
            return true;
          });
        });
        renderTable([header, ...rows].join("\n"), tableWrap);
      }

      async function run() {
        const guildId = guildSelect.value;
        if (!guildId) return;

        runBtn.disabled = true;
        status.textContent = "Generating report...";
        tableWrap.innerHTML = "";

        try {
          const res = await fetch(`/api/reports/${endpoint}/${guildId}`);
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          status.textContent = `${data.guildName} — ${data.totalMembers} members — ${data.generated}`;
          lastCsv = data.csv;
          lastGuildName = data.guildName;
          dlBtn.disabled = false;
          renderFiltered();
        } catch (err) {
          status.textContent = "Error: " + err.message;
        } finally {
          runBtn.disabled = false;
        }
      }

      fetch("/api/guilds")
        .then(r => r.json())
        .then(guilds => {
          guildSelect.innerHTML = guilds.length
            ? guilds.map(g => `<option value="${g.id}">${g.name}</option>`).join("")
            : "<option>No guilds found</option>";
          runBtn.disabled = !guilds.length;
          if (autoRun && guilds.length) run();
        });

      runBtn.addEventListener("click", run);

      dlBtn.addEventListener("click", () => {
        const blob = new Blob([lastCsv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
        a.download = `${endpoint}-${lastGuildName || "guild"}-${ts}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      if (searchInput) {
        searchInput.addEventListener("input", renderFiltered);
      }
    }

    createPanel("quick", "quick-report", true);
    createPanel("full", "user-report", false);

    document.querySelectorAll(".collapse-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const body = btn.closest(".card").querySelector(".card-body");
        body.classList.toggle("collapsed");
        btn.textContent = body.classList.contains("collapsed") ? "▾" : "▴";
      });
    });

    document.querySelectorAll(".card-header").forEach(header => {
      header.addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          const btn = header.querySelector(".collapse-btn");
          if (btn) btn.click();
        }
      });
    });

    const historyTable = document.getElementById("history-table");
    const historyStatus = document.getElementById("history-status");

    function loadHistory() {
      fetch("/api/history")
        .then(r => r.json())
        .then(reports => {
          if (!reports.length) {
            historyTable.innerHTML = "<p style='color:#a0a0a0'>No saved reports.</p>";
            historyStatus.textContent = "";
            return;
          }
          historyStatus.textContent = `${reports.length} report(s) saved`;
          let html = "<table><thead><tr><th>Guild</th><th>Type</th><th>Generated</th><th>Members</th><th>Actions</th></tr></thead><tbody>";
          for (const r of reports) {
            html += `<tr>
              <td>${r.guildName}</td>
              <td>${r.type}</td>
              <td>${new Date(r.generated).toLocaleString()}</td>
              <td>${r.totalMembers}</td>
              <td>
                <button class="btn-sm" onclick="downloadReport('${r.id}','${r.guildName}','${r.type}')">Download</button>
                <button class="btn-sm btn-danger" onclick="deleteReport('${r.id}')">Delete</button>
              </td>
            </tr>`;
          }
          html += "</tbody></table>";
          historyTable.innerHTML = html;
        })
        .catch(err => {
          historyStatus.textContent = "Error: " + err.message;
        });
    }

    window.downloadReport = async function(id, guildName, type) {
      const res = await fetch(`/api/history/${id}`);
      const data = await res.json();
      const blob = new Blob([data.csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const ts = data.generated.replace(/[:.]/g, "-").slice(0, 19);
      a.download = `${type}-${guildName}-${ts}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.deleteReport = async function(id) {
      if (!confirm("Delete this report?")) return;
      await fetch(`/api/history/${id}`, { method: "DELETE" });
      loadHistory();
    };

    document.getElementById("history-refresh").addEventListener("click", loadHistory);
    loadHistory();
  </script>
</body>
</html>
